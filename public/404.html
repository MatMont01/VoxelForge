<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Voxel Forge</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var redirect =
          "/?/" +
          location.pathname.replace(/^\//, "") +
          location.search +
          location.hash;
        location.replace(redirect);
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, sans-serif;
        background: #313841;
        color: #fff;
      }
      .wrap {
        display: grid;
        place-items: center;
        height: 100%;
        text-align: center;
        padding: 2rem;
      }
      .sub {
        opacity: 0.8;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>Redirigiendo…</h1>
        <p class="sub">Volviendo a la página principal.</p>
      </div>
    </div>
  </body>
</html>
