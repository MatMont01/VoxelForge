<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/voxel-forge-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>VOXEL FORGE</title>
    <meta
      name="description"
      content="VoxelForge - Servicios profesionales de impresión 3D en Santa Cruz de la Sierra. Ve tus pedidos imprimiéndose en vivo en TikTok."
    />

    <!-- Early theme setup to default to dark on first visit (no flash) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("darkMode");
          var isDark = saved ? JSON.parse(saved) : true; // default: dark
          if (isDark) {
            var html = document.documentElement;
            html.classList.add("dark");
            html.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Minimal dark fallback background before app styles load -->
    <style>
      html.dark body {
        background: #313841;
      }
    </style>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
    <script type="module" crossorigin src="/assets/index-C_QX4x4E.js"></script>

</html>
