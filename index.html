    <!-- Consent-based GA4 loader (no carga Analytics sin consentimiento) -->
    <style>
      #consent-banner {
        position: fixed;
        z-index: 60;
        left: 16px;
        right: 16px;
        bottom: 16px;
        max-width: 680px;
        margin: auto;

        padding: 16px;

      }

        flex-wrap: wrap;
      }
      #consent-banner .cb-btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #111827;
        cursor: pointer;
      }
      #consent-banner .cb-btn-primary {
        background: #ea9216;
        color: #fff;
        border-color: #ea9216;
      }
      html.dark #consent-banner .cb-btn {
        background: #313841;
        color: #f3f4f6;
        border-color: #4b5563;
      }
      html.dark #consent-banner .cb-btn-primary {
        background: #ea9216;
        border-color: #ea9216;
      }
      #consent-banner p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
      }
      #consent-banner a {
        color: #ea9216;
        text-decoration: underline;
      }
    </style>
    <script>
      (function () {
        const CONSENT_KEY = "vf_ga_consent";
        function loadGA4() {
          if (window.__gaLoaded) return;
          window.__gaLoaded = true;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-L88Z4WZLDP";
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          window.gtag = gtag;
          gtag("js", new Date());
          gtag("config", "G-L88Z4WZLDP");
        }
        function initConsent() {
          try {
            const dnt =
              navigator.doNotTrack == "1" ||
              window.doNotTrack == "1" ||
              navigator.msDoNotTrack == "1" ||
              window.globalPrivacyControl === true;
            const stored = localStorage.getItem(CONSENT_KEY);
            const banner = document.getElementById("consent-banner");
            if (stored === "granted") {
              if (banner) banner.style.display = "none";
              loadGA4();
              return;
            }
            if (stored === "denied" || dnt) {
              if (banner) banner.style.display = "none";
              return;
            }
            if (banner) banner.style.display = "block";
          } catch (e) {}
        }
        window.addEventListener("DOMContentLoaded", function () {
          var accept = document.getElementById("consent-accept");
          var decline = document.getElementById("consent-decline");
          if (accept)
            accept.addEventListener("click", function () {
              try {
                localStorage.setItem(CONSENT_KEY, "granted");
              } catch (e) {}
              var b = document.getElementById("consent-banner");
              if (b) b.style.display = "none";
              loadGA4();
            });
          if (decline)
            decline.addEventListener("click", function () {
              try {
                localStorage.setItem(CONSENT_KEY, "denied");
              } catch (e) {}
              var b = document.getElementById("consent-banner");
              if (b) b.style.display = "none";
            });
          initConsent();
        });
      })();
    </script>

    <!-- Early theme setup to default to dark on first visit (no flash) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("darkMode");
          var isDark = saved ? JSON.parse(saved) : true; // default: dark
          if (isDark) {
            var html = document.documentElement;
            html.classList.add("dark");
            html.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
